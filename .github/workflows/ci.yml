name: cloudguard-pro CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.12"
  TF_VERSION: "1.9.0"

jobs:

  # ── Job 1: Python tests + coverage ────────────────────────────────────────
  test:
    name: Test (pytest + moto)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=lambdas \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          FINDINGS_TABLE_NAME: cloudguard-findings-test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── Job 2: Python security scan (Bandit) ──────────────────────────────────
  scan-python:
    name: Scan Python (Bandit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: |
          bandit -r lambdas/ \
            -ll \
            -f json \
            -o bandit-report.json || true
          bandit -r lambdas/ \
            -ll

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ── Job 3: Terraform lint + validate ──────────────────────────────────────
  scan-terraform:
    name: Scan Terraform (Checkov + validate)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform init (local backend for validation)
        working-directory: terraform
        run: |
          # Override the S3 backend with local for CI validation only
          terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov on Terraform
        run: |
          checkov -d terraform/ \
            --framework terraform \
            --output sarif \
            --output-file checkov-results.sarif \
            --soft-fail || true
          checkov -d terraform/ \
            --framework terraform

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
        continue-on-error: true

  # ── Job 4: Ruff linting ───────────────────────────────────────────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check lambdas/ tests/

  # ── Job 5: Deploy Terraform (manual trigger / main only) ──────────────────
  deploy-tf:
    name: Deploy Terraform
    runs-on: ubuntu-latest
    needs: [test, scan-python, scan-terraform, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: sprint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}" \
            -out=tfplan

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply tfplan

  # ── Job 6: Deploy Pulumi (manual trigger / main only) ─────────────────────
  deploy-pulumi:
    name: Deploy Pulumi (Lambda layer)
    runs-on: ubuntu-latest
    needs: [deploy-tf]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: sprint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install Pulumi
        uses: pulumi/actions@v5

      - name: Install Python deps for Pulumi
        working-directory: pulumi
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Pulumi up
        working-directory: pulumi
        run: pulumi up --yes --stack dev
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
